name: Test

on:
  push:
    branches:
    - main
    - devel
  pull_request:
    branches:
    - main
    - devel

env:
  CTEST_OUTPUT_ON_FAILURE: ON
  CTEST_PARALLEL_LEVEL: 4
  CTEST_PROGRESS_OUTPUT: ON

jobs:
  python-versions:
    name: "Python versions"
    runs-on: "ubuntu-latest"
    outputs:
      python: ${{ steps.matrix.outputs.python }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: python3 .github/workflows/python_versions.py

  test:
    name: "Test python ${{ matrix.python-version }}"
    needs: python-versions
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.python) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # crocoddyl 3.2.1 is built against pinocchio 4.0: with 4.1 it crashes
      # (MemoryError in ResidualModelControlGrav, segfaults)
      - run: python -m pip install crocoddyl[build] proxsuite[build] "libpinocchio<4.1"
      - run: echo "CMAKE_PREFIX_PATH=$(cmeel cmake)" >> $GITHUB_ENV
      - run: cmake -B build -S .
      - run: cmake --build build -j 4

      - run: python -m pip install osqp
      - run: echo "LD_LIBRARY_PATH=$(cmeel lib)" >> $GITHUB_ENV
      - run: cmake --build build -t test
